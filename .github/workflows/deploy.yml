name: deploy

on:
  push:
    branches: [master]

# `id-token: write` es CRÍTICO: permite a GitHub firmar el JWT de OIDC que
# usamos para autenticar contra AWS sin tener AWS_ACCESS_KEY en GitHub Secrets.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Buildx permite builds multi-arquitectura. Necesario porque el runner
      # es x86 pero la EC2 es ARM (t4g).
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Asume el rol IAM de AWS via OIDC. NO usa access keys.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build y push de la imagen ARM64 con tag SHA + latest.
      - name: Build & push imagen
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/ml-traductores-app
          docker buildx build \
            --platform linux/arm64 \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push \
            .

      # SSM ejecuta deploy.sh remotamente, sin SSH.
      # Esperamos a que termine para fallar el job si el deploy falla.
      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${{ github.sha }}" \
            --parameters 'commands=["cd /opt/ml-traductores && ./scripts/deploy.sh"]' \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"
          echo "Esperando que termine..."

          # Espera hasta que el comando finalice (max 10 min por defecto).
          if ! aws ssm wait command-executed \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ secrets.EC2_INSTANCE_ID }}; then
            echo "Comando SSM falló o timeout"
          fi

          # Imprime stdout y stderr del deploy.sh en los logs de GitHub Actions.
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query "Status" --output text)

          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query "StandardOutputContent" --output text

          echo "=== STDERR ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy falló con status: $STATUS"
            exit 1
          fi

          echo "Deploy exitoso"
